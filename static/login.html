<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | Carnes VVH</title>
  <link rel="icon" href="/static/img/logo_vvh.ico">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/login.css">
</head>

<body class="login-page">
  <main class="login-container">
    <section class="login-card">
      <img src="/static/img/logo3.jpg" alt="Carnes VVH" class="login-logo">
      <h1>Carnes VVH</h1>
      <p class="login-subtitle">Panel administrativo</p>
      <form id="loginForm" class="login-form">
        <div class="form-group"><label for="username">Usuario</label><input id="username" name="username"
            autocomplete="username" maxlength="100" required></div>
        <div class="form-group"><label for="password">Contraseña</label><input id="password" name="password"
            type="password" autocomplete="current-password" maxlength="200" required></div>
        <button id="loginButton" class="btn-login" type="submit">Iniciar sesión</button>
        <p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>
      </form>
      <a href="/" class="back-link">← Regresar al catálogo</a>
    </section>
  </main>
  <footer class="site-footer">
    <p>
        © 2026 Carnes VVH.
        Todos los derechos reservados.
    </p>

    <p>
        Sistema desarrollado por Victor Salinas.
    </p>
</footer>
  <script src="/static/login.js"></script>
</body>

</html>
