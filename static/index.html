<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnes VVH - Catálogo de Cortes</title>
  <link rel="icon" href="/static/img/logo_vvh.ico">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/catalogo.css">
</head>

<body>
  <header class="public-header">
    <div class="public-header-content">
      <img src="/static/img/logo3.jpg" alt="Carnes VVH" class="logo-small">
      <div class="brand-info">
        <h1>Carnes VVH</h1>
        <p>Cortes selectos y complementos para tu parrilla</p>
      </div>
      <button id="btnVerCarrito" class="btn-carrito-header" type="button">🛒 Carrito (<span
          id="cantCarrito">0</span>)</button>
    </div>
  </header>

  <main class="container">
    <div class="filtros-bar">
      <label class="sr-only" for="inputBuscar">Buscar producto</label>
      <input id="inputBuscar" type="search" placeholder="Buscar producto...">
      <label class="sr-only" for="selectCategoria">Categoría</label>
      <select id="selectCategoria">
        <option value="">Todas las categorías</option>
      </select>
    </div>
    <h2 id="tituloCatalogo" class="catalogo-titulo">Nuestro Catálogo</h2>
    <div id="catalogo" class="catalogo-grid" aria-live="polite"></div>
  </main>

  <div id="modalCarrito" class="modal" role="dialog" aria-modal="true" aria-labelledby="carritoTitulo">
    <div class="modal-contenido">
      <button id="btnCerrarCarrito" class="cerrar-modal" type="button" aria-label="Cerrar">&times;</button>
      <h2 id="carritoTitulo" class="carrito-titulo">Tu pedido</h2>
      <div id="listaCarrito"></div>
      <div class="carrito-total">Total: $<span id="totalPrecio">0.00</span> MXN</div>
      <div class="pedido-datos">
        <label class="sr-only" for="nombreCliente">Nombre</label>
        <input id="nombreCliente" type="text" placeholder="Nombre del cliente" maxlength="150">
        <label class="sr-only" for="telefonoCliente">Teléfono</label>
        <input id="telefonoCliente" type="tel" placeholder="Teléfono" maxlength="30">
        <label class="sr-only" for="direccionCliente">Dirección</label>
        <textarea id="direccionCliente" placeholder="Dirección o indicaciones de entrega" maxlength="300"></textarea>
      </div>
      <button id="btnEnviarWhatsapp" class="btn-whatsapp" type="button">📲 Pedir por WhatsApp</button>
      <p id="mensajePedido" class="mensaje-pedido" role="alert" aria-live="polite"></p>
    </div>
  </div>

  <footer class="site-footer">
    <p>
        © 2026 Carnes VVH.
        Todos los derechos reservados.
    </p>

    <p>
        Sistema desarrollado por Victor Salinas.
    </p>
</footer>

  <script src="/static/script.js"></script>
</body>

</html>
