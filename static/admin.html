<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Carnes VVH</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" type="image/x-icon" href="/static/logo_vvh.ico">
</head>
<body>

    <header>
        <h1>Panel de Administración - Carnes VVH</h1>
    </header>

    <main class="container">
        <!-- Formulario 1: Agregar Producto -->
        <form id="formProducto" class="admin-form">
            <h3 class="form-title">Agregar Nuevo Producto</h3>
            
            <input type="text" id="nombre" placeholder="Nombre del producto" required>
            <input type="text" id="descripcion" placeholder="Descripción">
            <input type="number" step="0.01" id="precio" placeholder="Precio ($)" required>
            <input type="text" id="unidad_medida" placeholder="Unidad (kg, pieza, paquete)" required>
            <input type="number" step="0.1" id="stock" placeholder="Stock Inicial" required>
            <input type="number" id="categoria_id" placeholder="ID Categoría (1=Cortes, 2=Marinados, 3=Complementos)" required>
            <input type="url" id="imagen_url" placeholder="URL de Imagen (https://...)">
            
            <button type="submit" class="btn-agregar">Guardar Producto</button>
        </form>

        <!-- Formulario 2: Actualizar Producto (Inicialmente Oculto) -->
        <form id="formEditarProducto" class="admin-form admin-form-edit" style="display: none;">
            <div class="edit-header">
                <h3 class="form-title-edit">Actualizar Producto <span id="edit-id-badge">#0</span></h3>
                <button type="button" class="btn-cerrar" onclick="cancelarEdicion()">✕ Cancelar</button>
            </div>
            
            <input type="hidden" id="edit_id">
            <label class="form-label">Nombre:</label>
            <input type="text" id="edit_nombre" required>
            
            <label class="form-label">Descripción:</label>
            <input type="text" id="edit_descripcion">
            
            <label class="form-label">Precio ($):</label>
            <input type="number" step="0.01" id="edit_precio" required>
            
            <label class="form-label">Unidad de Medida:</label>
            <input type="text" id="edit_unidad_medida" required>
            
            <label class="form-label">Stock Disponible:</label>
            <input type="number" step="0.1" id="edit_stock" required>
            
            <label class="form-label">ID Categoría:</label>
            <input type="number" id="edit_categoria_id" required>
            
            <label class="form-label">URL de Imagen:</label>
            <input type="url" id="edit_imagen_url">
            
            <button type="submit" class="btn-actualizar">Guardar Cambios</button>
        </form>

        <!-- Tabla: Inventario de Productos -->
        <section class="admin-table-container">
            <h3 class="table-title">Inventario de Productos</h3>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Unidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <!-- Carga dinámica vía admin.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/admin.js"></script>
</body>
</html>
